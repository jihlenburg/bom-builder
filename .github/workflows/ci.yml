name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # make check pins its own toolchain (GOTOOLCHAIN=go1.25.12);
          # this bootstrap Go only needs to be new enough to download it.
          go-version: "1.25.x"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Unit tests, race tests, vet, the windows/amd64 cross-compilation
      # and vet gate, and the reproducible native build.
      - name: make check
        run: make check
