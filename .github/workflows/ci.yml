name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # make check pins its own toolchain (GOTOOLCHAIN=go1.25.12);
          # this bootstrap Go only needs to be new enough to download it.
          go-version: "1.25.x"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # Unit tests, race tests, vet, the windows/amd64 cross-compilation
      # and vet gate, and the reproducible native build.
      - name: make check
        run: make check

  # The cross-compilation gate proves Windows code compiles; this job
  # proves it runs: the full unit-test suite on a real Windows runner.
  # The race detector stays on the Linux job.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: native build
        run: go build -trimpath -o bin/bom-builder.exe ./cmd/bom-builder
