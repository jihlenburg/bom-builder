[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom-builder"
version = "2.0.0.0"
description = "Machine-first electrical BOM pricing across multiple providers"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
  "textual>=0.50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
nxp = [
  "playwright>=1.50",
]
standalone = [
  "pyinstaller>=6.0",
  "playwright>=1.50",
]

[project.scripts]
bom-builder = "bom_builder_cli:main"

[tool.setuptools]
py-modules = [
  "ai_resolver",
  "bom",
  "bom_builder_cli",
  "cli_models",
  "config",
  "console",
  "digikey",
  "digikey_auth",
  "fx",
  "lookup_cache",
  "main",
  "manufacturer_packaging",
  "models",
  "mouser",
  "mouser_packaging",
  "mouser_scoring",
  "nxp",
  "optimizer",
  "package",
  "provider_health",
  "report",
  "resolution_store",
  "secret_store",
  "ti",
]

[tool.setuptools.packages.find]
include = ["tui*"]

[tool.setuptools.data-files]
"share/bom-builder" = ["manufacturers.yaml", "packages.yaml"]
